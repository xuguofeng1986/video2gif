<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0B0C0F"><title>长按保存 GIF</title><style>body{margin:0;min-height:100vh;background:#0b0c0f;color:#f2f1ee;font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;box-sizing:border-box;text-align:center}h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.04em}h1 span{color:#d9b779}img{max-width:100%;max-height:72vh;border-radius:10px;box-shadow:0 18px 40px -16px #000c;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}p{margin:0;font-size:13px;color:#a4a4ac;line-height:1.75}a{color:#d9b779;text-decoration:none;font-size:14px;padding:10px 18px;border:1px solid rgba(217,183,121,.35);border-radius:999px}</style></head><body><h1>长按下方动图 → <span>保存图片</span></h1><img id="g" alt="GIF"><p id="tip">夸克提示“已保存至相册”即成功，一般在相册的「Quark」文件夹。<br>若长按没有“保存图片”，请回到上一页点「下载 GIF」。</p><a href="./">返回工具</a><script>(function(){var o=location.hash.slice(1),e=document.getElementById("g"),i=document.getElementById("tip");function t(){e.remove(),i.textContent="这张图片已失效（只保存在本机浏览器里），请返回工具重新生成。"}if(!/^[\w]+\/[^\/]+$/.test(o)){t();return}var c=new URL("gif/"+o,location.href).href;e.onerror=function(){if(e.onerror=null,!window.caches){t();return}caches.open("v2g-out").then(function(n){return n.match(c)}).then(function(n){return n?n.blob():null}).then(function(n){if(!n){t();return}var r=new FileReader;r.onload=function(){e.src=r.result},r.readAsDataURL(n)}).catch(t)},e.src=c})();</script></body></html>
